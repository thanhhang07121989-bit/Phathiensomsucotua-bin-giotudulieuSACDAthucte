  # Cấu hình dự án SCADA Tuabin gió (CARE_To_Compare)
dataset:
  raw_dir: "data/raw/CARE_To_Compare"
  sample_path: "data/sample/sample_84.csv"
  processed_dir: "data/processed"

columns:
  datetime_col: "time_stamp"
  asset_id_col: "asset_id"
  status_col: "status_type_id"
  id_col: "id"
  split_col: "train_test"

features:
  power_col: "power_30_avg"          # Grid power (Công suất phát thực tế)
  power_possible_col: "power_29_avg"   # Possible grid active power
  wind_speed_col: "wind_speed_3_avg"
  nacelle_dir_col: "sensor_42_avg"